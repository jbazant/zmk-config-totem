<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOTEM — Combined Layers</title>
  <style>
    :root {
      --bg: #1c1e22;
      --key: #ffffff;
      --key-border: #c5cad3;
      --base: #e8eaed;
      --key-label: #5c6370;
      --key-label-strong: #1a1d24;
      --nav: #d45b5b;
      --sym: #9b6bd6;
      --fun: #8a8296;
      --czech: #5ecf8e;
      --mod: #5b9fd4;
      --mod-bg: rgba(91, 159, 212, 0.28);
      --u: 72px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
      background: radial-gradient(ellipse at 50% 0%, #2a3040 0%, var(--bg) 55%);
      color: var(--base);
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      overflow-x: hidden;
      max-width: 100vw;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      font-size: 0.75rem;
      justify-content: center;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .swatch {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 2px;
    }

    .swatch.mod {
      background: var(--mod-bg);
      border: 1px solid var(--mod);
    }

    .board-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      padding: 0;
      line-height: 0;
      align-self: stretch;
    }

    .board {
      position: relative;
      width: calc(15.1 * var(--u));
      height: calc(5.5 * var(--u));
      transform-origin: top left;
    }

    .key {
      position: absolute;
      width: calc(1.059 * var(--u));
      height: calc(1 * var(--u));
      background: var(--key);
      border: 1px solid var(--key-border);
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      transform-origin: center center;
    }

    .key.has-mod {
      background:
        linear-gradient(var(--mod-bg), var(--mod-bg)),
        var(--key);
      border-color: color-mix(in srgb, var(--mod) 45%, var(--key-border));
    }

    .key.layer-switch {
      border-width: 2px;
    }

    .key .mod-label {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--mod);
      opacity: 0.9;
      line-height: 1;
      text-transform: uppercase;
    }

    .key .layers {
      display: flex;
      flex-wrap: wrap;
      gap: 1px 4px;
      width: 100%;
      min-height: 1.2em;
      align-content: center;
      justify-content: center;
      font-size: 0.78rem;
      line-height: 1.1;
      font-weight: 700;
    }

    .key .layers:empty { min-height: 0; }

    .key .base {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--key-label);
      line-height: 1.1;
      margin: 1px 0;
      text-align: center;
      opacity: 0.85;
    }

    .key .base .icon {
      width: 15px;
      height: 15px;
      display: block;
      margin: 0 auto;
      opacity: 0.7;
    }

    .key .tap-hint {
      font-size: 0.48rem;
      opacity: 0.45;
      line-height: 1;
      color: var(--key-label);
    }

    .key.thumb .base {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--key-label-strong);
      opacity: 1;
    }

    .key.thumb .base .icon {
      width: 22px;
      height: 22px;
      opacity: 1;
    }

    .key.thumb .tap-hint {
      font-size: 0.58rem;
      opacity: 0.8;
      font-weight: 600;
      color: var(--key-label-strong);
    }

    .key.thumb .layers {
      font-size: 0.85rem;
    }

    .key.thumb .mod-label {
      font-size: 0.95rem;
    }

    .c-nav   { color: var(--nav); }
    .c-sym   { color: var(--sym); }
    .c-fun   { color: var(--fun); }
    .c-czech { color: var(--czech); }

    .icon {
      width: 13px;
      height: 13px;
      display: inline-block;
      vertical-align: -2px;
      fill: currentColor;
    }

    .note {
      font-size: 0.7rem;
      opacity: 0.5;
      max-width: 40rem;
      text-align: center;
      line-height: 1.4;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body {
        background: #fff;
        color: #111;
        padding: 0.5rem;
        overflow: visible;
        max-width: none;
      }

      .note { display: none; }

      .board-wrap {
        overflow: visible;
        height: auto !important;
      }

      .board {
        transform: none !important;
      }

      .key {
        box-shadow: none;
        background: #fff;
      }

      .key .base {
        color: #666;
      }

      .key.thumb .base {
        color: #111;
      }
    }
  </style>
</head>
<body>
  <h1>TOTEM · all layers</h1>
  <div class="legend">
    <span><i class="swatch" style="background:var(--base)"></i> Base</span>
    <span><i class="swatch" style="background:var(--nav)"></i> Nav</span>
    <span><i class="swatch" style="background:var(--sym)"></i> Sym</span>
    <span><i class="swatch" style="background:var(--fun)"></i> Fun</span>
    <span><i class="swatch" style="background:var(--czech)"></i> Czech</span>
    <span><i class="swatch mod"></i> Homerow mods</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <script>
    // Inline SVG icons (currentColor)
    const I = {
      mute: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v2.2c.6.4 1 1 1 1.8s-.4 1.4-1 1.8V16a4.5 4.5 0 0 0 2.5-4zM16 3.2v2.1A7.9 7.9 0 0 1 20.5 12 7.9 7.9 0 0 1 16 18.7v2.1A9.9 9.9 0 0 0 22.5 12 9.9 9.9 0 0 0 16 3.2z"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
      volDn: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm11 3a3 3 0 0 0-1.5-2.6v5.2A3 3 0 0 0 15 12z"/></svg>`,
      volUp: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM16 3.2v2.1A7.9 7.9 0 0 1 20.5 12 7.9 7.9 0 0 1 16 18.7v2.1A9.9 9.9 0 0 0 22.5 12 9.9 9.9 0 0 0 16 3.2z"/></svg>`,
      briDn: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3 21L21 3" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>`,
      briUp: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`,
      prev: `<svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>`,
      play: `<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
      next: `<svg class="icon" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM5 18l8.5-6L5 6z"/></svg>`,
      coffee: `<svg class="icon" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 7.5a1.5 1.5 0 0 1 .5 2.9V19h-1v-1.6a1.5 1.5 0 0 1 .5-2.9z"/></svg>`,
      up: `<svg class="icon" viewBox="0 0 24 24"><path d="M12 5l7 9H5z"/></svg>`,
      dn: `<svg class="icon" viewBox="0 0 24 24"><path d="M12 19l-7-9h14z"/></svg>`,
      left: `<svg class="icon" viewBox="0 0 24 24"><path d="M5 12l9-7v14z"/></svg>`,
      right: `<svg class="icon" viewBox="0 0 24 24"><path d="M19 12l-9 7V5z"/></svg>`,
      home: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 12l8-8 8 8v8H4v-8zm2 6h4v-4h4v4h4v-5.2L12 6.8 6 12.8V18z"/></svg>`,
      end: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h2v12H4V6zm4 5h8.2l-2.3-2.3 1.4-1.4L20 12l-4.7 4.7-1.4-1.4 2.3-2.3H8v-2zm12-5h-2v12h2V6z"/></svg>`,
      pgup: `<svg class="icon" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5H7zm0 5h10v2H7v-2z"/></svg>`,
      pgdn: `<svg class="icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7zM7 5h10V3H7v2z"/></svg>`,
      del: `<svg class="icon" viewBox="0 0 24 24"><path d="M9 4h12v16H9l-7-8 7-8zm2 4l2.5 3L16 8l1.4 1.4-2.5 3 2.5 3L16 17l-2.5-3L11 17l-1.4-1.4 2.5-3-2.5-3L11 8z"/></svg>`,
      bspc: `<svg class="icon" viewBox="0 0 24 24"><path d="M22 6H9L2 12l7 6h13V6zm-4.3 9.3L16.3 14l-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3 1.4-1.4 2.3 2.3 2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4z"/></svg>`,
      tab: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h2v12H4V6zm4 5h7.2L13 8.8 14.4 7.4 20 13l-5.6 5.6-1.4-1.4L15.2 15H8v-4zm12-5h-2v12h2V6z"/></svg>`,
      ret: `<svg class="icon" viewBox="0 0 24 24"><path d="M19 7v6H7.8l2.3-2.3L8.7 9.3 4 14l4.7 4.7 1.4-1.4L7.8 15H21V7h-2z"/></svg>`,
      spc: `<svg class="icon" viewBox="0 0 24 24"><path d="M3 14h18v3H3v-3z"/></svg>`,
      esc: `<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" fill="none"/></svg>`,
    };

    const MOD = {
      LCTRL: "⌃", RCTRL: "⌃",
      LALT: "⌥", RALT: "⌥",
      LGUI: "⌘", RGUI: "⌘",
      LSHIFT: "⇧", RSHFT: "⇧", LSHFT: "⇧",
    };

    // Physical layout from config/info.json (u units)
    const POS = [
      { x: 0.776, y: 1.519, r: -10 },
      { x: 1.964, y: 0.605, r: -4 },
      { x: 3.175, y: 0, r: 0 },
      { x: 4.234, y: 0.496, r: 0 },
      { x: 5.292, y: 0.656, r: 0 },
      { x: 8.682, y: 0.656, r: 0 },
      { x: 9.741, y: 0.496, r: 0 },
      { x: 10.8, y: 0, r: 0 },
      { x: 12.007, y: 0.606, r: 4 },
      { x: 13.199, y: 1.52, r: 10 },
      { x: 0.95, y: 2.504, r: -10 },
      { x: 2.033, y: 1.602, r: -4 },
      { x: 3.175, y: 1, r: 0 },
      { x: 4.234, y: 1.496, r: 0 },
      { x: 5.292, y: 1.656, r: 0 },
      { x: 8.682, y: 1.661, r: 0 },
      { x: 9.741, y: 1.496, r: 0 },
      { x: 10.8, y: 1, r: 0 },
      { x: 11.937, y: 1.603, r: 4 },
      { x: 13.026, y: 2.505, r: 10 },
      { x: 0, y: 3.231, r: -10 },
      { x: 1.124, y: 3.489, r: -10 },
      { x: 2.103, y: 2.6, r: -4 },
      { x: 3.175, y: 2, r: 0 },
      { x: 4.234, y: 2.496, r: 0 },
      { x: 5.292, y: 2.656, r: 0 },
      { x: 8.682, y: 2.661, r: 0 },
      { x: 9.741, y: 2.496, r: 0 },
      { x: 10.8, y: 2, r: 0 },
      { x: 11.868, y: 2.601, r: 4 },
      { x: 12.852, y: 3.49, r: 10 },
      { x: 13.973, y: 3.231, r: 10 },
      { x: 3.938, y: 3.714, r: 0 },
      { x: 5.11, y: 3.878, r: 15 },
      { x: 6.195, y: 4.329, r: 30 },
      { x: 7.781, y: 4.329, r: -30 },
      { x: 8.866, y: 3.878, r: -15 },
      { x: 10.037, y: 3.714, r: 0 },
    ];

    const LAYER_COLORS = {
      Nav: "var(--nav)",
      Sym: "var(--sym)",
      Fun: "var(--fun)",
      Czech: "var(--czech)",
    };

    // Per-key: base label, optional mod (shown once), optional layerSwitch, overlays by layer
    // Overlays ignore &trans; hm hold side not repeated (mod already on key)
    const KEYS = [
      // 0–9 top row
      { base: "Q", overlays: { Nav: "~", Sym: "!" } },
      { base: "W", overlays: { Nav: I.home, Sym: "@", Czech: "ě" } },
      { base: "E", overlays: { Nav: I.up, Sym: "#", Fun: I.mute, Czech: "é" } },
      { base: "R", overlays: { Nav: I.end, Sym: "$", Fun: I.volDn, Czech: "ř" } },
      { base: "T", overlays: { Nav: I.pgup, Sym: "%", Fun: I.volUp, Czech: "ť" } },
      { base: "Y", overlays: { Nav: "÷", Sym: "^", Fun: "F11", Czech: "ý" } },
      { base: "U", overlays: { Nav: "7", Sym: "&", Fun: "F12", Czech: "ú" } },
      { base: "I", overlays: { Nav: "8", Sym: "*", Fun: "F13", Czech: "í" } },
      { base: "O", overlays: { Nav: "9", Sym: "'", Fun: "F14", Czech: "ó" } },
      { base: "P", overlays: { Nav: "−", Sym: '"', Fun: "F15" } },

      // 10–19 home row
      { base: "A", mod: "LCTRL", overlays: { Sym: "°", Czech: "á" } },
      { base: "S", mod: "LALT", overlays: { Nav: I.left, Sym: "~", Czech: "š" } },
      { base: "D", mod: "LGUI", overlays: { Nav: I.dn, Sym: "{", Czech: "ď" } },
      { base: "F", mod: "LSHIFT", overlays: { Nav: I.right, Sym: "[", Fun: I.briDn } },
      { base: "G", overlays: { Nav: I.pgdn, Sym: "(", Fun: I.briUp } },
      { base: "H", overlays: { Nav: "×", Sym: "@", Fun: "F6" } },
      { base: "J", mod: "RSHFT", overlays: { Nav: "4", Sym: "€", Fun: "F7", Czech: "ů" } },
      { base: "K", mod: "RGUI", overlays: { Nav: "5", Sym: "§", Fun: "F8" } },
      { base: "L", mod: "RALT", overlays: { Nav: "6", Fun: "F9", Czech: "ô" } },
      { base: ";", mod: "RCTRL", overlays: { Nav: "+", Sym: "\\", Fun: "F10" } },

      // 20–31 bottom alpha + outer
      { base: I.esc, layerSwitch: "Fun", tapHint: "Esc", overlays: {} },
      { base: "Z", overlays: { Czech: "ž" } },
      { base: "X", overlays: { Nav: ",", Czech: "ß" } },
      { base: "C", overlays: { Nav: "_", Sym: "}", Fun: I.prev, Czech: "č" } },
      { base: "V", overlays: { Nav: "(", Sym: "]", Fun: I.play, Czech: "ˇ" } },
      { base: "B", overlays: { Nav: ")", Sym: ")", Fun: I.next, Czech: "¨" } },
      { base: "N", overlays: { Nav: "0", Sym: "−", Fun: "F1", Czech: "ň" } },
      { base: "M", overlays: { Nav: "1", Sym: "=", Fun: "F2", Czech: "´" } },
      { base: ",", overlays: { Nav: "2", Fun: "F3" } },
      { base: ".", overlays: { Nav: "3", Fun: "F4" } },
      { base: "/", overlays: { Nav: "=", Fun: "F5" } },
      { base: "'", layerSwitch: "Czech", tapHint: "'", overlays: { Fun: I.coffee } },

      // 32–37 thumbs
      { base: I.del, mod: "LGUI", tapHint: "Del", overlays: {} },
      { base: I.tab, layerSwitch: "Nav", tapHint: "Tab", overlays: {} },
      { base: I.spc, tapHint: "Space", overlays: {} },
      { base: I.ret, tapHint: "Enter", overlays: {} },
      { base: I.bspc, layerSwitch: "Sym", tapHint: "Bksp", overlays: {} },
      { base: "−", layerSwitch: "Czech", tapHint: "−", overlays: { Nav: "." } },
    ];

    const board = document.getElementById("board");

    KEYS.forEach((k, i) => {
      const p = POS[i];
      const el = document.createElement("div");
      el.className = "key";
      if (i >= 32) el.classList.add("thumb");
      if (k.mod) el.classList.add("has-mod");
      if (k.layerSwitch) {
        el.classList.add("layer-switch");
        el.style.background = `color-mix(in srgb, ${LAYER_COLORS[k.layerSwitch]} 28%, var(--key))`;
        el.style.borderColor = LAYER_COLORS[k.layerSwitch];
      }

      el.style.left = `calc(${p.x} * var(--u))`;
      el.style.top = `calc(${p.y} * var(--u))`;
      if (p.r) el.style.transform = `rotate(${p.r}deg)`;

      let html = "";
      if (k.mod) {
        html += `<span class="mod-label" title="${k.mod}">${MOD[k.mod] || k.mod}</span>`;
      }

      const order = ["Nav", "Sym", "Fun", "Czech"];
      const cells = order
        .filter((L) => k.overlays[L] != null)
        .map((L) => `<span class="c-${L.toLowerCase()}">${k.overlays[L]}</span>`)
        .join("");
      html += `<div class="layers">${cells}</div>`;

      const baseHtml = typeof k.base === "string" && k.base.startsWith("<svg")
        ? k.base
        : k.base;
      html += `<div class="base">${baseHtml}</div>`;
      if (k.tapHint) html += `<div class="tap-hint">${k.tapHint}</div>`;

      el.innerHTML = html;
      board.appendChild(el);
    });

    const wrap = document.querySelector(".board-wrap");
    function fitBoard() {
      board.style.transform = "none";
      wrap.style.height = "";
      const scale = Math.min(1, wrap.clientWidth / board.offsetWidth);
      const dx = (wrap.clientWidth - board.offsetWidth * scale) / 2;
      board.style.transform = `translate(${dx}px, 0) scale(${scale})`;
      wrap.style.height = `${board.offsetHeight * scale}px`;
    }
    fitBoard();
    window.addEventListener("resize", fitBoard);
  </script>
</body>
</html>
